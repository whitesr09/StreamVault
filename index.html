<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<!--
  STREAMVAULT v4.3 — surgical fixes over v4.2 (playback path untouched)
  1) POSTER SIZES FIXED: cards now hard-locked to uniform width (148px / 172px desktop)
     with absolute-positioned cover images → no more mixed sizes in carousels & grids.
  2) HEADER BACKGROUND REMOVED: fixed header is fully transparent (no band/seam).
     Pages that own a head-bar (settings/ext/api/servers/detail/player) hide the fixed
     header to avoid double bars; browse/search/home bars absorb the logo zone.
  3) NAV BAR: always pinned (never hides on scroll), much more transparent
     (rgba(10,14,10,.42) + light blur).
  4) SETTINGS ACCENT DOTS FIXED: colors render again (inline backgrounds restored),
     theme switching stays instant/in-place (no re-render lag).
  5) PLAYER TOOLBAR DE-GIMMICKED: fake play/pause/±10s buttons REMOVED (they could
     never control a cross-origin embed). Remaining bar = only real functions:
     Servers, Episodes, Subtitle prefs, Settings sheet, Fullscreen, New-tab.
     The embedded player's own controls are left 100% untouched.
  6) Misc: broken flag emojis fixed (🇮🇳 / 🇺🇸), scroll handler trimmed to rAF fab-only,
     everything else (servers, sandbox gate, failover, extensions, backups) unchanged.
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050807">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>StreamVault</title>
<link rel="preconnect" href="https://image.tmdb.org" crossorigin>
<link rel="preconnect" href="https://api.themoviedb.org" crossorigin>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23050807' width='100' height='100' rx='24'/><text x='50' y='68' text-anchor='middle' fill='%23a3e635' font-size='46' font-weight='800' font-family='Arial'>SV</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/inter@latest/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/css/poppins@latest/index.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#050807;--card:rgba(22,30,22,.55);--card-solid:#121a13;--glass:rgba(255,255,255,.06);--accent:#a3e635;--gold:#f5c518;--tx:#f4f7f2;--tx2:#a8b3a6;--tx3:#6d7a6c;--line:rgba(255,255,255,.07);--r-md:16px;--r-lg:24px;--r-xl:32px;--nav-h:64px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);--blur:blur(14px) saturate(150%)}
[data-theme="amoled"]{--bg:#000;--card:rgba(18,18,18,.6);--card-solid:#0d0d0d}
[data-theme="light"]{--bg:#f2f5f0;--card:rgba(255,255,255,.72);--card-solid:#fff;--tx:#152015;--tx2:#5a665a;--tx3:#8a968a;--line:rgba(0,0,0,.08)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*::-webkit-scrollbar{display:none}*{-ms-overflow-style:none;scrollbar-width:none}
html{font-size:14px;-webkit-text-size-adjust:100%}
@media(min-width:768px){html{font-size:16px}}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100dvh;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + 28px + var(--safe-b))}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 480px at 85% -10%,rgba(163,230,53,.15),transparent 60%),radial-gradient(700px 420px at -15% 35%,rgba(132,204,22,.09),transparent 60%),var(--bg)}
h1,h2,h3,h4{font-family:'Poppins',sans-serif;font-weight:700}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer}
input,select{font-family:inherit}
.glass{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line);border-radius:var(--r-lg)}
[data-liquidglass="off"] .glass{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--card-solid)}
/* transparent floating header */
#top-header{position:fixed;top:0;left:0;right:0;z-index:90;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--safe-t)) 18px 10px;background:transparent;border:none}
.logo{display:flex;align-items:center;gap:10px;font-family:'Poppins';font-weight:800;font-size:1.25rem;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.logo i{color:var(--accent);font-size:1.5rem}
.hbtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;color:var(--tx2);text-shadow:0 2px 8px rgba(0,0,0,.5)}
.hbtn:active{background:var(--glass)}
body[data-page="movie"] #top-header,body[data-page="tv"] #top-header,body[data-page="player"] #top-header,body[data-page="settings"] #top-header,body[data-page="ext"] #top-header,body[data-page="api"] #top-header,body[data-page="servers"] #top-header{display:none}
/* pinned translucent nav */
#bottom-nav{position:fixed;left:14px;right:14px;bottom:calc(14px + var(--safe-b));z-index:95;height:var(--nav-h);border-radius:999px;background:rgba(10,14,10,.42);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 34px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:space-around}
[data-liquidglass="off"] #bottom-nav{background:var(--card-solid)}
.nitem{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;color:var(--tx3);transition:background .2s,color .2s}
.nitem.active{background:rgba(255,255,255,.14);color:var(--tx)}
main{min-height:100dvh;padding-top:0}
#fab-top{position:fixed;right:18px;bottom:calc(var(--nav-h) + 34px + var(--safe-b));z-index:94;width:52px;height:52px;border-radius:50%;background:rgba(20,26,18,.8);border:2px solid var(--accent);color:var(--accent);display:none;align-items:center;justify-content:center;font-size:1.1rem}
#fab-top.show{display:flex}
#iframe-pill{position:fixed;top:calc(8px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:999;display:none;align-items:center;gap:8px;background:var(--accent);color:#0a0f08;font-weight:800;font-size:.78rem;padding:9px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#iframe-pill.show{display:flex}
.row{padding:14px 0;content-visibility:auto;contain-intrinsic-size:320px}
.row-head{display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin-bottom:12px}
.row-head h2{font-size:1.25rem}
.viewall{display:flex;align-items:center;gap:6px;color:var(--tx2);font-size:.9rem}
.track{display:flex;gap:12px;overflow-x:auto;padding:0 18px;scroll-snap-type:x mandatory}
/* UNIFORM CARD SIZE FIX */
.pcard{flex:0 0 auto;width:148px;min-width:148px;max-width:148px;scroll-snap-align:start;cursor:pointer}
@media(min-width:768px){.pcard{width:172px;min-width:172px;max-width:172px}}
.grid .pcard{width:100%;min-width:0;max-width:none}
.pcard:active{transform:scale(.96)}
.pposter{position:relative;width:100%;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;background:var(--card-solid)}
.pposter img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pposter .bm{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;z-index:2}
.pposter .bm.saved{color:var(--accent)}
.badge18{position:absolute;top:8px;left:8px;background:#ef4444;color:#fff;font-size:.6rem;font-weight:800;padding:2px 7px;border-radius:6px;z-index:2}
.ptitle{margin-top:8px;font-size:.9rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{margin-top:2px;font-size:.78rem;color:var(--tx2);display:flex;gap:8px;align-items:center}
.pmeta i{color:var(--tx);font-size:.7rem}
.hero{position:relative;margin:6px 14px 10px;border-radius:var(--r-xl);overflow:hidden;height:52svh;max-height:460px}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity .7s}
.hero-slide.active{opacity:1}
.hero-slide img{width:100%;height:100%;object-fit:cover;animation:kb 24s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.hero-grad{position:absolute;inset:0;background:linear-gradient(to top,rgba(5,8,7,.95),rgba(5,8,7,.25) 45%,transparent 75%)}
.hero-card{position:absolute;left:14px;right:14px;bottom:14px;padding:14px 16px;border-radius:var(--r-lg);background:rgba(12,18,12,.5);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.hero-card h1{font-size:clamp(1.2rem,4.5vw,1.9rem);line-height:1.15;margin-bottom:6px}
.hero-meta{display:flex;gap:10px;align-items:center;font-size:.8rem;color:var(--tx2);margin-bottom:10px;flex-wrap:wrap}
.hero-meta .rt{color:var(--gold);font-weight:600;display:flex;gap:4px;align-items:center}
.hero-btns{display:flex;gap:10px}
.btn-primary{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:#0a0f08;font-weight:700;padding:11px;border-radius:14px;font-size:.92rem}
.btn-primary:active{transform:scale(.97)}
.btn-ghost{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--tx);font-weight:600;padding:11px;border-radius:14px;font-size:.92rem}
.hero-dots{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.hdot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35)}
.hdot.active{background:var(--accent);width:20px;border-radius:4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 18px 10px}
.chip{flex-shrink:0;padding:8px 16px;border-radius:999px;background:var(--glass);border:1px solid var(--line);color:var(--tx2);font-size:.82rem;font-weight:500}
.chip.active{background:var(--accent);border-color:var(--accent);color:#0a0f08;font-weight:700}
/* unified sticky bars (absorb transparent logo zone where header visible) */
.bhead,.searchwrap{position:sticky;top:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(56px + var(--safe-t) + 10px) 18px 12px;background:rgba(5,8,7,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.bhead h1{font-size:1.3rem}
.searchwrap{display:block}
.xhead{position:sticky;top:0;z-index:60;background:rgba(5,8,7,.9);backdrop-filter:blur(14px);padding:calc(12px + var(--safe-t)) 18px 12px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}
.xhead h1{font-size:1.35rem;flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 18px}
@media(min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(6,1fr)}}
.dback{position:relative;height:46vh;overflow:hidden}
.dback img{width:100%;height:100%;object-fit:cover}
.dback .ov{position:absolute;inset:0;background:linear-gradient(to top,var(--bg),transparent 55%,rgba(0,0,0,.35))}
.dtop{position:absolute;top:calc(12px + var(--safe-t));left:14px;right:14px;display:flex;justify-content:space-between;z-index:4}
.circ{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff}
.dbody{position:relative;z-index:3;margin-top:-70px;padding:0 18px}
.dposter{width:118px;aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;border:2px solid rgba(255,255,255,.15);box-shadow:0 10px 34px rgba(0,0,0,.6);margin-bottom:14px}
.dposter img{width:100%;height:100%;object-fit:cover}
.dtitle{font-size:clamp(1.3rem,4.5vw,2rem);line-height:1.2}
.dmeta{display:flex;gap:12px;flex-wrap:wrap;color:var(--tx2);font-size:.85rem;margin:8px 0 10px}
.dmeta .rt{color:var(--gold);font-weight:600}
.gchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.gchip{padding:4px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:.74rem;color:var(--tx2)}
.dactions{display:flex;gap:10px;margin:14px 0 20px;flex-wrap:wrap}
.sect{margin:22px 0}
.sect h3{font-size:1.05rem;margin-bottom:12px}
.oview{color:var(--tx2);line-height:1.7;font-size:.92rem}
.oview.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.rm{color:var(--accent);font-size:.85rem;font-weight:600;margin-top:6px}
.castrow{display:flex;gap:14px;overflow-x:auto}
.cast{flex:0 0 72px;text-align:center}
.cast img{width:62px;height:62px;border-radius:50%;object-fit:cover;margin:0 auto 6px;border:2px solid var(--line)}
.cast b{font-size:.7rem;display:block;line-height:1.25;font-weight:600}
.cast span{font-size:.62rem;color:var(--tx3)}
.seas{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.stab{flex-shrink:0;padding:8px 16px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--tx2)}
.stab.active{background:var(--accent);border-color:var(--accent);color:#0a0f08}
.ep{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.ep img{width:118px;aspect-ratio:16/9;object-fit:cover;border-radius:10px;flex-shrink:0;background:var(--card-solid)}
.ep b{font-size:.86rem;display:block;margin-bottom:3px}
.ep span{font-size:.72rem;color:var(--tx3);display:block;margin-bottom:4px}
.ep p{font-size:.74rem;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* PLAYER */
.ppage{background:#000;min-height:100dvh;padding-bottom:30px}
.ptop{display:flex;align-items:center;gap:12px;padding:calc(12px + var(--safe-t)) 14px 10px;background:#000;color:#fff}
.ptop .t{flex:1;text-align:center;font-size:.95rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstage{position:relative;width:100%;aspect-ratio:16/9;background:#000}
.pstage.fs{position:fixed;inset:0;z-index:400;aspect-ratio:auto}
.pstage iframe{width:100%;height:100%;border:none;display:block}
.gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:linear-gradient(180deg,#0b120a,#000)}
.gate i.big{font-size:2.4rem;color:var(--accent)}
.gate h3{color:#fff;font-size:1.05rem}
.gate p{color:#9aa89a;font-size:.82rem;line-height:1.6;max-width:420px}
.gate .btn-primary{width:100%;max-width:320px;padding:14px;font-size:.95rem;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(163,230,53,.5)}50%{box-shadow:0 0 0 12px rgba(163,230,53,0)}}
.gate .btn-ghost{width:100%;max-width:320px}
/* functional-only toolbar */
.pbar{display:flex;align-items:center;justify-content:space-around;padding:8px 10px;background:rgba(10,14,10,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.pbar button{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.05rem;color:#e8efe6}
.pbar button:active{background:rgba(255,255,255,.12)}
.pinfo{padding:16px 18px;background:var(--bg)}
.pinfo h2{font-size:1.15rem}
.pinfo p{color:var(--tx3);font-size:.85rem;margin-top:3px}
.echips{display:flex;gap:8px;overflow-x:auto;padding:0 18px 14px;background:var(--bg)}
.echip{flex-shrink:0;padding:8px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:.76rem;color:var(--tx2)}
.echip.active{background:var(--accent);border-color:var(--accent);color:#0a0f08;font-weight:700}
.wbtn{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 18px 14px;padding:13px;border-radius:14px;background:var(--glass);border:1px solid var(--line);color:var(--tx2);font-weight:600;font-size:.88rem;width:calc(100% - 36px)}
.stabs{display:flex;gap:8px;overflow-x:auto;padding:12px 18px;background:var(--bg)}
.stab2{flex-shrink:0;padding:9px 16px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:.8rem;font-weight:600;color:var(--tx2)}
.stab2.active{background:var(--accent);border-color:var(--accent);color:#0a0f08}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:500;background:rgba(14,18,14,.94);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:var(--r-xl) var(--r-xl) 0 0;border-top:1px solid var(--line);max-height:78vh;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:translateY(0)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.sheet-h b{font-size:1.05rem;font-family:'Poppins'}
.sheet-b{overflow-y:auto;padding:10px 14px calc(16px + var(--safe-b))}
.srv{display:flex;align-items:center;gap:14px;padding:14px 12px;border-radius:14px;margin-bottom:4px}
.srv:active{background:rgba(255,255,255,.06)}
.srv.active{background:rgba(255,255,255,.08)}
.srv .grip{color:var(--tx3);font-size:.9rem}
.srv .flag{font-size:1.5rem}
.srv .nm{flex:1;font-size:.98rem;font-weight:600}
.srv .chk{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#0a0f08;display:none;align-items:center;justify-content:center;font-size:.8rem}
.srv.active .chk{display:flex}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 6px 14px}
.setcard{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:14px}
.setcard .lb{display:flex;gap:8px;align-items:center;color:var(--tx3);font-size:.7rem;letter-spacing:1px;font-weight:700;margin-bottom:6px}
.setcard .vl{font-size:1.15rem;font-weight:700;font-family:'Poppins'}
.setrow{display:flex;align-items:center;gap:14px;padding:15px 8px;border-bottom:1px solid var(--line);font-size:.98rem;font-weight:600}
.setrow i{color:var(--tx2);width:22px;text-align:center}
.setrow .chev{margin-left:auto;color:var(--tx3)}
.tgl{width:46px;height:26px;border-radius:13px;background:rgba(255,255,255,.15);position:relative;transition:.2s;flex-shrink:0}
.tgl.on{background:var(--accent)}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tgl.on::after{transform:translateX(20px)}
.closebtn{margin:12px 6px 4px;padding:15px;border-radius:16px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:800;letter-spacing:2px;font-size:.9rem}
.subprev{margin:10px 6px;padding:14px;border-radius:12px;background:rgba(0,0,0,.5);text-align:center}
.fontpills{display:flex;gap:8px;background:rgba(255,255,255,.06);border-radius:999px;padding:5px}
.fontpills button{flex:1;padding:9px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--tx2)}
.fontpills button.active{background:#e8efe6;color:#111}
.cdots{display:flex;gap:12px}
.cdot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;flex-shrink:0}
.cdot.active{border-color:rgba(255,255,255,.7)}
input[type=range]{width:100%;accent-color:var(--accent)}
.stabs3{display:flex;gap:22px;overflow-x:auto;padding:6px 18px 0;border-bottom:1px solid var(--line)}
.stab3{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:12px 2px 14px;font-size:.95rem;font-weight:600;color:var(--tx3);border-bottom:2px solid transparent}
.stab3.active{color:var(--tx);border-bottom-color:var(--tx)}
.scard{margin:16px 14px;padding:20px;border-radius:var(--r-lg);background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--line)}
[data-liquidglass="off"] .scard{background:var(--card-solid)}
.scard h3{font-size:1.15rem;margin-bottom:6px}
.scard .desc{color:var(--tx2);font-size:.88rem;line-height:1.55;margin-bottom:14px}
.srow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.srow .ic{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.srow b{display:block;font-size:.95rem}
.srow span{font-size:.8rem;color:var(--tx3)}

async function tmdb(ep,pr){
  pr=pr||{};var u=new URL(CFG.BASE+ep);Object.keys(pr).forEach(function(k){if(pr[k]!=null)u.searchParams.set(k,pr[k])});
  var key=u.toString();var c=cache.get(key);if(c&&Date.now()-c.t<CFG.TTL)return c.d;
  for(var a=0;a<3;a++){try{
    var r=await fetch(key,{headers:{Authorization:'Bearer '+(S.api.bearer||CFG.TMDB_BEARER)}});
    if(r.status===429){await new Promise(function(x){setTimeout(x,900*(a+1))});continue}
    if(!r.ok)throw 0;var d=await r.json();if(cache.size>140)cache.clear();cache.set(key,{d:d,t:Date.now()});return d;
  }catch(e){if(a===2)return null;await new Promise(function(x){setTimeout(x,500*(a+1))})}}
  return null;
}

var bPage=1,bLoad=false,bType='movie',bPages=1;
async function pBrowse(t){
  bType=t;bPage=1;bLoad=false;
  document.getElementById('view').innerHTML='<div class="bhead"><h1>'+({movie:'Movies',tv:'TV Shows',anime:'Anime'}[t])+'</h1><button class="hbtn" onclick="filterSheet()"><i class="fas fa-sliders"></i></button></div><div class="grid" id="g">'+Array(9).fill('<div><div class="skel" style="aspect-ratio:2/3"></div></div>').join('')+'</div><div id="lm" style="height:60px"></div>';
  await bMore();
  new IntersectionObserver(function(e){if(e[0].isIntersecting&&!bLoad&&bPage<=bPages)bMore()},{threshold:.1}).observe(document.getElementById('lm'));

async function bMore(){
  if(bLoad)return;bLoad=true;var pr={page:bPage,include_adult:S.adult},ep;
  if(bType==='anime'){ep='/discover/movie';pr.with_genres=16;pr.with_keywords=210024}
  else if(bType==='movie')ep='/movie/popular';else ep='/tv/popular';
  if(S._fg){pr.with_genres=S._fg;ep=bType==='tv'?'/discover/tv':'/discover/movie'}
  if(S._fs)pr.sort_by=S._fs;
  var d=await tmdb(ep,pr);bLoad=false;if(!d||!d.results)return;bPages=d.total_pages||1;
  var g=document.getElementById('g');if(!g)return;if(bPage===1)g.innerHTML='';
  var frag=document.createDocumentFragment();
  d.results.forEach(function(it){if(!S.adult&&it.adult)return;var w=document.createElement('div');w.innerHTML=pcard(it,bType==='anime'?'movie':bType);frag.appendChild(w.firstElementChild)});
  g.appendChild(frag);bPage++;
}

var PL={list:[],idx:0,type:'movie',id:'',s:'1',e:'1',fs:false};
function hash(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}
function serverById(id){for(var i=0;i<CFG.SERVERS.length;i++)if(CFG.SERVERS[i].id===id)return CFG.SERVERS[i];return CFG.SERVERS[0]}
function serverList(type){
  var out=[];

  S.plugins.forEach(function(p){var sv=serverById(p.bridge);out.push({name:p.name,flag:'🔌',url:(type==='movie'?sv.m:sv.t)})});
  return out;
}

/* EXTENSIONS (CloudStream ecosystem) */
function normalizeRepoUrl(u){
  u=String(u||'').trim();
  if(u.indexOf('cloudstreamrepo://')===0)u='https://'+u.slice('cloudstreamrepo://'.length);
  if(u.indexOf('://')===-1)u='https://'+u;
  if(u.indexOf('github.com')>-1&&u.indexOf('raw.githubusercontent.com')===-1)u=u.replace('github.com','raw.githubusercontent.com').replace('/blob/','/');
  return u;
}
function flagOf(l){l=(l||'EN').toLowerCase();return l.indexOf('hi')===0||l==='hindi'?'🇮':(l.indexOf('en')===0||l==='english'?'🇬🇧':'🌐')}
function normPlugin(p,repoUrl){return{name:p.name||p.pluginName||'Plugin',version:p.version||1,description:p.description||p.desc||'',iconUrl:p.iconUrl||p.icon||'',language:p.language||'EN',nsfw:!!(p.nsfw||p.adult),fileSize:p.fileSize||0,url:p.url||'',tvTypes:p.tvTypes||[],repo:repoUrl,bridge:p.bridge||CFG.SERVERS[Math.abs(hash(p.name||'p'))%CFG.SERVERS.length].id}}
async function loadCloudstreamRepo(inputUrl){
  var raw=normalizeRepoUrl(inputUrl);var plugins=[];
  var first=raw.slice(-5)==='.json'?await fetchJSON(raw):null;
  var root=first||await fetchJSON(raw.replace(/\/$/,'')+'/repo.json')||await fetchJSON(raw);
  if(root){
    if(Array.isArray(root))plugins=root;
    else if(root.pluginLists&&root.pluginLists.length){for(var i=0;i<root.pluginLists.length;i++){var arr=await fetchJSON(normalizeRepoUrl(root.pluginLists[i]));if(Array.isArray(arr))plugins=plugins.concat(arr)}}
    else if(Array.isArray(root.plugins))plugins=root.plugins;
    else if(Array.isArray(root.extensions))plugins=root.extensions;
    else if(Array.isArray(root.sources))plugins=root.sources;
  }
  if(!plugins.length){var b=await fetchJSON(raw.replace(/\/$/,'')+'/builds/repo.json');if(Array.isArray(b))plugins=b}
  return plugins.map(function(p){return normPlugin(p,inputUrl)});
}

  if(setTab==='data')body='<div class="scard"><h3>Local Backup & Restore</h3><p class="desc">Everything lives only on this device: watchlist, history, repos, plugins, keys, preferences.</p><button class="btn-primary" style="width:100%" onclick="exp()"><i class="fas fa-download"></i> Export backup (.json)</button><button class="btn-ghost" style="width:100%;margin-top:8px" onclick="document.getElementById(\'imp\').click()"><i class="fas fa-upload"></i> Restore from backup</button><input type="file" id="imp" accept=".json" style="display:none" onchange="imp(event)"><button class="btn-ghost danger" style="width:100%;margin-top:14px" onclick="if(confirm(\'Clear watchlist?\')){S.watchlist=[];LS.set(\'watchlist\',[]);toast(\'Watchlist cleared\')}">Clear watchlist</button><button class="btn-ghost danger" style="width:100%;margin-top:8px" onclick="if(confirm(\'Clear history?\')){S.history=[];LS.set(\'history\',[]);toast(\'History cleared\')}">Clear history</button><button class="btn-ghost danger" style="width:100%;margin-top:8px" onclick="if(confirm(\'Reset EVERYTHING?\')){localStorage.clear();location.reload()}">Factory reset</button></div><div class="about"><b>StreamVault v4.3</b><br>TMDB API used, not endorsed by TMDB.<br>Servers are third-party embeds.<br>Extensions follow the CloudStream repo format.<br>Installable PWA — add to home screen.</div>';
  document.getElementById('view').innerHTML='<div class="xhead"><button class="hbtn" onclick="history.back()"><i class="fas fa-arrow-left"></i></button><h1><i class="fas fa-gear" style="color:var(--accent);margin-right:8px"></i>Settings</h1></div><div class="stabs3">'+tabs.map(function(t){return '<button class="stab3 '+(setTab===t[0]?'active':'')+'" onclick="setTab=\''+t[0]+'\';pSettings()"><i class="fas '+t[1]+'"></i> '+t[2]+'</button>'}).join('')+'</div>'+body;

function exp(){var b=new Blob([JSON.stringify({watchlist:S.watchlist,history:S.history,recents:S.recents,repos:S.repos,plugins:S.plugins,api:S.api,subs:S.subs,adult:S.adult,theme:S.theme,accent:S.accent,liquid:S.liquid,offServers:S.offServers,quality:S.quality},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='streamvault-backup.json';a.click();toast('Backup exported','ok')}
function imp(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);
  if(d.watchlist){S.watchlist=d.watchlist;LS.set('watchlist',S.watchlist)}if(d.history){S.history=d.history;LS.set('history',S.history)}
  if(d.recents){S.recents=d.recents;LS.set('recents',S.recents)}if(d.repos){S.repos=d.repos;LS.set('repos',S.repos)}
  if(d.plugins){S.plugins=d.plugins;LS.set('plugins',S.plugins)}if(d.api){S.api=d.api;LS.set('api',S.api)}
  if(d.subs){S.subs=d.subs;LS.set('subs',S.subs)}if(d.offServers){S.offServers=d.offServers;LS.set('offServers',S.offServers)}
  if(d.adult!==undefined){S.adult=d.adult;LS.set('adult',S.adult)}if(d.theme){S.theme=d.theme;LS.set('theme',S.theme)}
  if(d.accent){S.accent=d.accent;LS.set('accent',S.accent)}if(d.liquid!==undefined){S.liquid=d.liquid;LS.set('liquid',S.liquid)}
  if(d.quality)S.quality=d.quality;applyTheme();toast('Backup restored','ok');pSettings();
}catch(x){toast('Invalid backup file','err')}};r.readAsText(f)}
/* PWA */
addEventListener('beforeinstallprompt',function(e){e.preventDefault();toast('Use browser menu → Add to Home Screen','inf')});
if('serviceWorker' in navigator){
  var sw='self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil(self.clients.claim()));self.addEventListener("fetch",e=>{if(e.request.method!=="GET")return;e.respondWith(caches.open("sv-v9").then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{if(res&&res.status===200&&res.type==="basic")c.put(e.request,res.clone());return res}).catch(()=>r)))});';
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'text/javascript'}))).catch(function(){});
}
